# AllFlag CI: format, analyze, test and a release App Bundle build on every PR
# and push to main. Runs on GitHub runners; no secrets are needed or used.
name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to the local toolchain (Flutter 3.47.2 / Dart 3.13.2).
  FLUTTER_VERSION: '3.47.2'

jobs:
  analyze-and-test:
    name: format + analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  build:
    name: build appbundle (release, throwaway key)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # build.gradle.kts refuses release builds without android/key.properties
      # (never unsigned). CI signs with a one-day throwaway key only to prove
      # the release build works; the .aab is never uploaded or published. The
      # real upload keystore never lives in the repo or on a runner. No
      # admob.json either: CI builds always carry Google's test ad IDs.
      - name: Throwaway keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-throwaway.jks" \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 1 \
            -alias ci \
            -dname "CN=CI Throwaway, OU=CI, O=CI, L=CI, ST=CI, C=US" \
            -storepass ci-throwaway -keypass ci-throwaway
          cat > android/key.properties <<PROPS
          storePassword=ci-throwaway
          keyPassword=ci-throwaway
          keyAlias=ci
          storeFile=$RUNNER_TEMP/ci-throwaway.jks
          PROPS
      - run: flutter build appbundle --release
      - name: No secrets left behind
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/ci-throwaway.jks"
