name: allflag
description: Turn your phone into the flag you want to show right now.
publish_to: 'none'
version: 1.0.0+12
environment:
  sdk: ^3.13.2
dependencies:
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3 # Matches flutter_localizations on Flutter 3.47.2.
  shared_preferences: ^2.5.5
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/allflag-icon.png
    - assets/flags/
    - assets/data/countries.json
    - docs/UNICODE_LICENSE.txt

